<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Monitoreo Rosas 🌹</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ===== ESTILOS COMPLETOS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Login Inicial */
        .login-inicial {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .login-inicial-content {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            overflow: hidden;
        }

        .login-inicial-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .login-inicial-header i {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .login-inicial-form {
            padding: 30px;
        }

        .login-inicial-form h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .campo {
            margin-bottom: 15px;
        }

        .campo label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #667eea;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn-login-inicial {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-login-inicial:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .login-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
        }

        /* Contenedor principal */
        #app-contenedor {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        /* Header */
        header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #d63384;
        }

        .header-content h1 {
            color: #d63384;
            font-size: 28px;
        }

        /* Notificaciones */
        .notificaciones-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .notificacion {
            background: white;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 15px;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes shake {
            0%,100%{transform:translateX(0)}
            10%,30%,50%,70%,90%{transform:translateX(-5px)}
            20%,40%,60%,80%{transform:translateX(5px)}
        }
    </style>
</head>
<body>
    <!-- Notificaciones -->
    <div id="notificaciones" class="notificaciones-container"></div>

    <!-- Pantalla de Login Inicial -->
    <div id="login-inicial" class="login-inicial">
        <div class="login-inicial-content">
            <div class="login-inicial-header">
                <i class="fas fa-rose"></i>
                <h1>Sistema de Monitoreo de Rosas</h1>
                <p>Versión 3.0</p>
            </div>
            
            <div class="login-inicial-form">
                <h2><i class="fas fa-user-lock"></i> Iniciar Sesión</h2>
                <div class="campo">
                    <label>Usuario:</label>
                    <input type="text" id="login-usuario" value="root">
                </div>
                <div class="campo">
                    <label>Contraseña:</label>
                    <input type="password" id="login-password" value="root1234">
                </div>
                <button class="btn-login-inicial" onclick="verificarLoginInicial()">
                    <i class="fas fa-sign-in-alt"></i> Ingresar
                </button>
                <div class="login-info">
                    <p><strong>Usuarios:</strong> root/root1234, admin/admin123, operario/oper123</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Aplicación principal -->
    <div id="app-contenedor" style="display: none;">
        <header>
            <div class="header-content">
                <h1><i class="fas fa-rose"></i> SISTEMA DE MONITOREO</h1>
                <p>Usuario: <span id="usuario-actual">Visitante</span></p>
            </div>
        </header>
        
        <div style="text-align: center; padding: 50px;">
            <h2>¡Bienvenido al Sistema!</h2>
            <p>El login funciona correctamente.</p>
            <button onclick="cerrarSesion()" style="padding: 10px 20px; margin-top: 20px;">
                Cerrar Sesión
            </button>
        </div>
    </div>

    <script>
        // ===== CONFIGURACIÓN =====
        const CONFIG = {
            STORAGE_KEYS: {
                USUARIOS: 'usuarios_sistema',
                USUARIO: 'usuario_sesion'
            }
        };

        let usuarioActual = null;

        // ===== INICIALIZACIÓN AUTOMÁTICA =====
        (function() {
            console.log('🚀 Inicializando sistema...');
            
            // Crear usuarios por defecto
            if (!localStorage.getItem(CONFIG.STORAGE_KEYS.USUARIOS)) {
                const usuarios = {
                    root: { password: 'root1234', rol: 'superadmin', nombre: 'Super Admin' },
                    superadmin: { password: 'masterkey', rol: 'superadmin', nombre: 'Control Total' },
                    admin: { password: 'admin123', rol: 'admin', nombre: 'Administrador' },
                    cristian: { password: '1234', rol: 'admin', nombre: 'Cristian' },
                    supervisor: { password: 'super123', rol: 'supervisor', nombre: 'Supervisor' },
                    operario: { password: 'oper123', rol: 'operario', nombre: 'Operario' }
                };
                localStorage.setItem(CONFIG.STORAGE_KEYS.USUARIOS, JSON.stringify(usuarios));
                console.log('✅ Usuarios creados:', Object.keys(usuarios));
            }
        })();

        // ===== FUNCIÓN DE LOGIN =====
        function verificarLoginInicial() {
            console.log('🔍 Verificando login...');
            
            const usuario = document.getElementById('login-usuario').value;
            const password = document.getElementById('login-password').value;
            
            if (!usuario || !password) {
                mostrarNotificacion('❌ Complete todos los campos', 'error');
                return;
            }
            
            // Obtener usuarios
            const usuarios = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.USUARIOS)) || {};
            console.log('Usuarios disponibles:', Object.keys(usuarios));
            
            // Verificar
            if (usuarios[usuario] && usuarios[usuario].password === password) {
                usuarioActual = {
                    usuario: usuario,
                    rol: usuarios[usuario].rol,
                    nombre: usuarios[usuario].nombre
                };
                
                localStorage.setItem(CONFIG.STORAGE_KEYS.USUARIO, JSON.stringify(usuarioActual));
                
                document.getElementById('login-inicial').style.display = 'none';
                document.getElementById('app-contenedor').style.display = 'block';
                document.getElementById('usuario-actual').textContent = usuarios[usuario].nombre;
                
                mostrarNotificacion('✅ Bienvenido ' + usuarios[usuario].nombre, 'success');
                console.log('✅ Login exitoso');
            } else {
                mostrarNotificacion('❌ Usuario o contraseña incorrectos', 'error');
                document.querySelector('.login-inicial-form').style.animation = 'shake 0.5s';
                setTimeout(() => {
                    document.querySelector('.login-inicial-form').style.animation = '';
                }, 500);
            }
        }

        function cerrarSesion() {
            localStorage.removeItem(CONFIG.STORAGE_KEYS.USUARIO);
            usuarioActual = null;
            document.getElementById('app-contenedor').style.display = 'none';
            document.getElementById('login-inicial').style.display = 'flex';
            mostrarNotificacion('👋 Sesión cerrada', 'info');
        }

        function mostrarNotificacion(mensaje, tipo) {
            const container = document.getElementById('notificaciones');
            const id = 'notif-' + Date.now();
            
            const notif = document.createElement('div');
            notif.className = `notificacion ${tipo}`;
            notif.id = id;
            notif.innerHTML = `
                <i class="fas ${tipo === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
                <span>${mensaje}</span>
            `;
            
            container.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        // Verificar sesión guardada
        (function() {
            const sesion = localStorage.getItem(CONFIG.STORAGE_KEYS.USUARIO);
            if (sesion) {
                usuarioActual = JSON.parse(sesion);
                document.getElementById('login-inicial').style.display = 'none';
                document.getElementById('app-contenedor').style.display = 'block';
                document.getElementById('usuario-actual').textContent = usuarioActual.nombre;
            }
        })();
    </script>
</body>
</html>
